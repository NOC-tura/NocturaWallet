# app.noc-tura.io — generated by scripts/gen-nginx-conf.mjs from deploy/security-headers.mjs.
# DO NOT EDIT THIS FILE. Edit the source and re-run the generator; `npm run nginx:check`
# fails on a hand edit.
#
# Separate server block, separate origin (§6.5): separate storage, separate cookies, and a
# policy that never has to accommodate the marketing site's needs. It shares a machine with
# the coordinator, which is the known single-host risk in §8 — the wallet goes down when the
# API does. Accepted for S0 in exchange for /api and /rpc being genuinely same-origin, which
# is what lets connect-src stay at 'self' and removes CORS from the picture entirely.

# Cache-Control lives here rather than in the locations it applies to. nginx's add_header does
# not merge: a single add_header inside a location DISCARDS every add_header inherited from the
# server block, so a Cache-Control on /assets/ would have quietly served the bundle with no CSP
# and no HSTS. An empty value makes nginx emit nothing, which is what the proxied paths want —
# the coordinator's own Cache-Control then passes through unchanged.
map $uri $noctura_cache_control {
    default                 "no-cache";
    "~^/assets/"            "public, max-age=31536000, immutable";
    "/index.html"           "no-cache";
    "/build-manifest.json"  "no-cache";
    "~^/(api/|rpc$)"        "";
}

server {
    listen 80;
    listen [::]:80;
    server_name app.noc-tura.io;

    # ACME stays reachable over plain HTTP; everything else is redirected before it can
    # carry anything. The redirect is 301 so the HSTS header below is reached once and then
    # the browser stops using http:// on its own.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.noc-tura.io;

    ssl_certificate     /etc/letsencrypt/live/app.noc-tura.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.noc-tura.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:WalletSSL:10m;
    ssl_session_tickets off;

    # OCSP stapling: the browser gets the revocation answer with the handshake instead of
    # asking the CA, which is both faster and one fewer party learning who visits.
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/app.noc-tura.io;
    index index.html;

    # The bundle is public and the machine is shared; nothing here should announce the
    # version of the thing serving it.
    server_tokens off;

    # the policy above; the build gate proves the bundle needs no exception to it
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Two years, subdomains included. NOT preload, and that is a decision rather than an
    # omission: preload is submitted for the apex, applies to every *.noc-tura.io at once, and
    # removal takes months. It requires every subdomain to be HTTPS-only first — api., dao.,
    # walletapp. — so it is an apex-level step to take deliberately, not a header to add here.
    # Until then this host is protected and the preload list is not involved. Note what HSTS is
    # NOT: the app pins certificates, a browser cannot. HSTS and a CAA record are what the web has
    # instead, and they are weaker. Do not claim otherwise.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # stops a response being re-interpreted as script because its bytes looked like some
    add_header X-Content-Type-Options "nosniff" always;

    # nothing outbound should carry where the user was. On a wallet the path can name an
    # address, and the referral link carries one in the query string.
    add_header Referrer-Policy "no-referrer" always;

    # frame-ancestors 'none' for browsers that do not implement it
    add_header X-Frame-Options "DENY" always;

    # severs the opener relationship with anything cross-origin, but keeps popups WE open
    # usable. Not plain 'same-origin': some wallets complete a connection through a popup that
    # talks back through window.opener, and breaking that would look like our bug.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # our assets are not for other sites to embed
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # deny everything the app does not use. Two are worth naming: geolocation, because the
    # compliance gate is decided server-side from the IP and the page must never be able to ask
    # the browser instead; and publickey-credentials-get, because the S2 passkey vault would need
    # it — denying it now means enabling it later is a visible change in a diff.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

    add_header Cache-Control $noctura_cache_control always;

    # Cross-Origin-Embedder-Policy is deliberately absent: no SharedArrayBuffer and no cross-origin subresources; revisit only with WASM proving

    # The coordinator, same-origin from the browser's point of view. proxy_ssl_server_name
    # is required or the TLS handshake to the upstream goes out without SNI and lands on the
    # wrong vhost. The Origin is set here rather than forwarded: it is what the coordinator
    # allowlists, and a browser-supplied value is not a control anyway (§6.6).
    location /api/ {
        proxy_pass https://api.noc-tura.io/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.noc-tura.io;
        proxy_set_header Origin https://app.noc-tura.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;

        # The upstream sets its own CORS headers for browsers arriving directly. Arriving
        # through here the request is same-origin, so those headers are noise at best and a
        # second, contradictory answer at worst.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    # /rpc is a single method-allowlisted endpoint, not a prefix. Exact-match location so
    # nothing else can be reached through it, and no trailing path is passed upstream.
    location = /rpc {
        proxy_pass https://api.noc-tura.io/api/v1/rpc;
        proxy_ssl_server_name on;
        proxy_set_header Host api.noc-tura.io;
        proxy_set_header Origin https://app.noc-tura.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    # No SPA fallback on purpose. S0 has no client-side router (verified: no pushState, no
    # useLocation, no path reading anywhere in web/src), so every real URL is a real file.
    # A blanket try_files $uri /index.html would answer 200 for every typo and every probe,
    # which makes a mistyped link look like a working page and hides scanning in the logs.
    location / {
        try_files $uri $uri/ =404;
    }
}
