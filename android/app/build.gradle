apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// react-native-config: generates BuildConfig fields from .env so Config.* is
// non-undefined in JS. Without this line, all `import Config from 'react-native-config'`
// values are undefined → src/modules/solana/connection.ts silently falls back
// to the mainnet RPC, which made every devnet getBalance return 0.
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

// ── Release signing ──────────────────────────────────────────────────────────
// Read from android/keystore.properties (gitignored) with an environment
// override for CI. Absent credentials do NOT fall back to the debug keystore:
// that is how a release APK signed with a publicly-known key shipped in the
// first place. Missing credentials fail the release build instead (see the
// task guard at the bottom of this file).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = System.getenv("NOCTURA_KEYSTORE_FILE") ?: keystoreProperties["storeFile"]
def releaseStorePassword = System.getenv("NOCTURA_KEYSTORE_PASSWORD") ?: keystoreProperties["storePassword"]
def releaseKeyAlias = System.getenv("NOCTURA_KEY_ALIAS") ?: keystoreProperties["keyAlias"]
def releaseKeyPassword = System.getenv("NOCTURA_KEY_PASSWORD") ?: keystoreProperties["keyPassword"]
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword &&
        file(releaseStoreFile).exists()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nocturawallet"
    defaultConfig {
        applicationId "com.nocturawallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    // Native blst module (libnoctura_key.so) is DISABLED: it bundles its own NDK-27
    // libc++_shared.so which conflicts with React Native's at startup, crashing every
    // release build on launch (verified on-device 2026-06-30, OnePlus 9 Pro). C2
    // shielded uses the JS view-key model and never calls native, so this is safe.
    // RE-ENABLE only with the libc++ conflict fixed (ANDROID_STL=c++_static in the
    // CMake build) + on-device verification, when native shielded ops are needed
    // (Project 2 / withdraw recoverability). See project_native_libcpp_crash memory.
    // externalNativeBuild {
    //     cmake {
    //         path "src/main/cpp/CMakeLists.txt"
    //     }
    // }
    packagingOptions {
        jniLibs {
            // Exclude any stale libnoctura_key.so from build intermediates so the
            // disabled module can't sneak its conflicting libc++_shared into the APK.
            excludes += ["**/libnoctura_key.so"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing is defined ONLY when real credentials are present.
        // Credentials live in android/keystore.properties (gitignored) or the
        // environment — never in android/gradle.properties, which is tracked.
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The release build used to be signed with the CHECKED-IN debug
            // keystore (password 'android'), so anyone could build a
            // signature-matching APK and overwrite the installed wallet in
            // place. It is now signed with a real key, or not signed at all —
            // never with a key everyone has. See the guard below.
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}


// Fail a release build loudly rather than emitting an unsigned — or worse,
// debug-signed — artifact. Consistent with the rest of this codebase: a
// misconfiguration should stop the build, not quietly produce something that
// looks shippable.
tasks.configureEach { task ->
    if (!hasReleaseSigning && task.name ==~ /(?i)(assemble|bundle|install)[A-Za-z]*Release/) {
        task.doFirst {
            throw new GradleException(
                "No release signing key configured.\n" +
                "  The release build is NOT signed with the debug keystore any more — that key is\n" +
                "  checked into this repo with password 'android', so anyone could build a\n" +
                "  signature-matching APK and replace the installed wallet.\n\n" +
                "  1. Create a key:\n" +
                "       keytool -genkeypair -v -keystore android/app/noctura-release.jks \\\n" +
                "         -alias noctura-upload -keyalg RSA -keysize 4096 -validity 10000\n" +
                "  2. cp android/keystore.properties.example android/keystore.properties\n" +
                "  3. Fill it in. Both files are gitignored; do NOT put credentials in\n" +
                "     android/gradle.properties, which IS tracked.\n\n" +
                "  CI may instead set NOCTURA_KEYSTORE_FILE / _PASSWORD / NOCTURA_KEY_ALIAS / _KEY_PASSWORD."
            )
        }
    }
}
