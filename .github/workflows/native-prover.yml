name: Native prover

# The Rust prover has never been compiled by anything but a developer's machine.
# That is the same category as an untracked toolchain: the results are not wrong,
# they are unfalsifiable — nobody else could build it in order to disagree.
#
# It matters more after the A0 circuit freeze, when `nk` is assembled inside
# native and never crosses the JS bridge. At that point the wallet's custody
# guarantee lives entirely on the side of the boundary the JS suite cannot see,
# so this job is the only place it can be checked at all.

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-prover.yml', 'src/constants/provingAssets.ts']
  pull_request:
    paths: ['native/**', '.github/workflows/native-prover.yml', 'src/constants/provingAssets.ts']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: native/noctura-prover
    # GitHub's default for `run` is `bash -e {0}` — no pipefail — so a pipeline
    # exits with its LAST command's status and `cargo test | tee` reports success
    # on a failing test. That is not hypothetical: it happened on this
    # workflow's first run, and only the positive control below noticed.
    #
    # `shell: bash` selects `bash --noprofile --norc -eo pipefail {0}`, which
    # fixes it for EVERY step rather than the one step someone remembered. The
    # per-step `set -o pipefail` further down is left in place deliberately:
    # a future edit that drops this default should not silently re-arm the bug.
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # CONTROL ON THE SHELL ITSELF. Every assertion below is only worth what
      # this job's exit-status handling is worth, and "shell: bash implies
      # pipefail" is a claim about GitHub's runner, not something this
      # repository controls. So it is measured on every run instead of trusted:
      # under `bash -e` alone this step FAILS, under `-eo pipefail` it passes.
      - name: Assert this job's shell cannot mask a failing pipeline
        working-directory: .
        run: |
          if (exit 1) | cat; then
            echo "::error::pipefail is OFF in this job — a failing command piped into another reports success, and every gate below can silently pass. See the first run of this workflow."
            exit 1
          fi
          echo "shell propagates pipeline failure"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/noctura-prover

      # The integration test proves a real deposit against the SAME artifacts the
      # wallet ships, pinned by SHA-256 in src/constants/provingAssets.ts. Reading
      # the pins from there rather than restating them means a drift between the
      # prover's fixtures and the wallet's pins fails here instead of on a device.
      # `artifacts/` is gitignored, so without this step the integration test
      # panics on a missing file — it does not skip.
      # Cache ONLY the two downloaded artifacts, listed by name. Caching the
      # whole `artifacts/` directory would let a stale cache overwrite the
      # tracked deposit_input.json fixture on restore, silently reverting a
      # file that git owns.
      #
      # A cache hit is not trusted on the strength of its key: the step below
      # re-hashes whatever it finds against the pin, so a stale or poisoned
      # cache entry fails exactly as a corrupted download would. That check is
      # what makes caching safe here rather than a second source of truth.
      - name: Cache the pinned circuit artifacts
        uses: actions/cache@v4
        with:
          path: |
            native/noctura-prover/artifacts/deposit_final.zkey
            native/noctura-prover/artifacts/deposit.wasm
          key: zk-artifacts-${{ hashFiles('src/constants/provingAssets.ts') }}

      - name: Fetch and verify pinned circuit artifacts
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p native/noctura-prover/artifacts
          base=$(grep -E "^const BASE" src/constants/provingAssets.ts | sed -E "s/.*'([^']+)'.*/\1/")
          # Pins look like:  zkey: at('<64 hex>', '<file>'),
          # The download URL is content-addressed — `/h/<sha256>/<file>` serves only
          # if the request digest equals the actual one — so the hash check below is
          # a second, independent confirmation rather than the only one.
          pins=$(grep -A4 "^  deposit: {" src/constants/provingAssets.ts \
                 | grep -oE "at\('[0-9a-f]{64}', '[^']+'\)" \
                 | sed -E "s/at\('([0-9a-f]{64})', '([^']+)'\)/\1 \2/")
          [ -n "$pins" ] || { echo "::error::could not read the deposit pins from provingAssets.ts — the file's format may have changed"; exit 1; }
          handled=0
          while read -r want file; do
            dest="native/noctura-prover/artifacts/$file"
            if [ -f "$dest" ] && [ "$(sha256sum "$dest" | cut -d' ' -f1)" = "$want" ]; then
              echo "$file served from cache and re-verified against the wallet's pin: $want"
              handled=$((handled + 1))
              continue
            fi
            # --connect-timeout bounds an unreachable host. Without it a hard
            # outage burned ~135s per attempt, four attempts, on every run.
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 300 "$base/h/$want/$file" -o "$dest" || {
              echo "::error::could not download $file from $base — either the coordinator's asset host was unreachable, or it has no artifact with digest $want. This gate is deliberately fail-closed: it will not test the prover against artifacts it could not verify."
              exit 1
            }
            got=$(sha256sum "$dest" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::$file SHA-256 mismatch — pinned $want, downloaded $got"
              exit 1
            fi
            echo "$file downloaded and verified against the wallet's pin: $want"
            handled=$((handled + 1))
          done <<< "$pins"
          # No silent narrowing: if the parse above matched fewer lines than there
          # are artifacts, every step after this would test a subset and pass.
          if [ "$handled" != "2" ]; then
            echo "::error::expected 2 deposit artifacts, handled $handled — the pin parse matched the wrong number of lines"
            exit 1
          fi

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # --locked fails if Cargo.lock would need updating, so a dependency cannot
      # drift without a committed lockfile change.
      # `set -o pipefail` is load-bearing: without it the pipeline exits with
      # tee's status, so a FAILING test produced a GREEN step. That is exactly
      # what happened on this workflow's first run — the positive control below
      # was the only thing that caught it.
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee /tmp/cargo-test.log

      # The assertion lives in one place so both controls exercise the SAME code.
      # `cargo test` reports success when zero tests run, and a suite that
      # silently stopped executing its only meaningful test is indistinguishable
      # from a passing one.
      - name: Write the interop assertion
        working-directory: .
        run: |
          cat > /tmp/assert-interop.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          grep -q "test deposit_prove_to_bytes_matches_public_inputs \.\.\. ok" "$1"
          SH
          chmod +x /tmp/assert-interop.sh

      # POSITIVE CONTROL — the assertion passes on the real log.
      - name: Assert the interop test actually ran
        working-directory: .
        run: |
          if ! /tmp/assert-interop.sh /tmp/cargo-test.log; then
            echo "::error::The deposit interop test did not run. A green suite that skipped it proves nothing."
            cat /tmp/cargo-test.log
            exit 1
          fi
          echo "interop test executed and passed"

      # NEGATIVE CONTROL — the SAME assertion must fail on a log where the test
      # is absent. Without this, a broken matcher makes the positive control
      # permanently permissive and nothing reports it.
      - name: Assert the interop check can fail
        working-directory: .
        run: |
          printf 'running 0 tests\n\ntest result: ok. 0 passed; 0 failed\n' > /tmp/cargo-test-empty.log
          if /tmp/assert-interop.sh /tmp/cargo-test-empty.log; then
            echo "::error::the interop assertion PASSED on a log with no tests — it cannot fail, so it proves nothing"
            exit 1
          fi
          echo "interop assertion is falsifiable"
